<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKU Control Oficial</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --color-green: #2ecc71;
            --color-yellow: #f1c40f;
            --color-red: #e74c3c;
            --color-blue: #3498db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 412px;
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 20px;
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 20px; }
        h2, h3 { margin: 0 0 10px 0; }

        .citas-container {
            background-color: rgba(52, 152, 219, 0.08);
            border-left: 5px solid var(--color-blue);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .citas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .citas-header h3 { font-size: 15px; margin: 0; color: #2980b9; }
        .btn-add-cita {
            background-color: var(--color-blue);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 4px 12px;
            font-size: 11px;
            cursor: pointer;
            width: auto;
            margin: 0;
        }
        .form-cita-box {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            display: none;
        }
        .form-cita-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .form-cita-box div { display: flex; gap: 8px; }
        .form-cita-box button { padding: 8px; font-size: 12px; margin: 0; }
        .citas-lista { list-style: none; padding: 0; margin: 0; }
        .cita-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
        }
        .cita-item:last-child { margin-bottom: 0; }
        .cita-fecha-info { font-weight: bold; color: #475569; font-size: 11px; }

        .medidor-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .circulo-progreso {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(var(--color-green) 0%, #e0e0e0 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        .circulo-interno {
            width: 130px;
            height: 130px;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .valores-fa { font-size: 24px; font-weight: bold; }
        
        .meta-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .btn-edit-meta {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            margin: 0;
            width: auto;
            display: inline;
        }

        .btn-undo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -10px;
            margin-bottom: 20px;
        }
        .btn-undo {
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            width: auto;
            margin: 0;
        }
        .btn-undo:disabled { opacity: 0.4; cursor: not-allowed; }

        .calculadora-box { background: #f8f9fa; padding: 15px; border-radius: 18px; margin-bottom: 20px; }
        input[type="text"], input[type="number"], button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .sugerencias-lista {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            max-height: 180px;
            overflow-y: auto;
            margin-top: -10px;
            margin-bottom: 10px;
            padding: 0;
            list-style: none;
            display: none;
        }
        .sugerencias-lista li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .sugerencias-lista li:hover { background-color: #f1f1f1; }
        
        .tag-alimento {
            font-size: 10px;
            font-weight: bold;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            text-transform: uppercase;
        }
        .tag-permitido { background-color: var(--color-green); }
        .tag-controlado { background-color: var(--color-yellow); color: #744210; }
        .tag-prohibido { background-color: var(--color-red); }

        .alimento-seleccionado {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }
        
        .medida-sugerida-texto {
            display: block;
            font-size: 11px;
            font-weight: normal;
            color: #475569;
            margin-top: 5px;
