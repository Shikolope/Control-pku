<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKU Control Oficial</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --color-green: #2ecc71;
            --color-yellow: #f1c40f;
            --color-red: #e74c3c;
            --color-blue: #3498db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 412px;
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 20px;
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 20px; }
        h2, h3 { margin: 0 0 10px 0; }

        /* Estilos de la Zona de Citas Médicas */
        .citas-container {
            background-color: rgba(52, 152, 219, 0.08);
            border-left: 5px solid var(--color-blue);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .citas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .citas-header h3 { font-size: 15px; margin: 0; color: #2980b9; }
        .btn-add-cita {
            background-color: var(--color-blue);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 4px 12px;
            font-size: 11px;
            cursor: pointer;
            width: auto;
            margin: 0;
        }
        .form-cita-box {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            display: none; /* Se muestra al hacer click */
        }
        .form-cita-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .form-cita-box div {
            display: flex;
            gap: 8px;
        }
        .form-cita-box button {
            padding: 8px;
            font-size: 12px;
            margin: 0;
        }
        .citas-lista {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .cita-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
        }
        .cita-item:last-child { margin-bottom: 0; }
        .cita-fecha-info { font-weight: bold; color: #475569; font-size: 11px; }

        .medidor-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .circulo-progreso {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(var(--color-green) 0%, #e0e0e0 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        .circulo-interno {
            width: 130px;
            height: 130px;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .valores-fa { font-size: 24px; font-weight: bold; }
        
        .meta-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .btn-edit-meta {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            margin: 0;
            width: auto;
            display: inline;
        }

        .btn-undo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -10px;
            margin-bottom: 20px;
        }
        .btn-undo {
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            width: auto;
            margin: 0;
        }
        .btn-undo:disabled { opacity: 0.4; cursor: not-allowed; }

        .calculadora-box { background: #f8f9fa; padding: 15px; border-radius: 18px; margin-bottom: 20px; }
        input[type="text"], input[type="number"], button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .sugerencias-lista {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            max-height: 150px;
            overflow-y: auto;
            margin-top: -10px;
            margin-bottom: 10px;
            padding: 0;
            list-style: none;
            display: none;
        }
        .sugerencias-lista li { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .sugerencias-lista li:hover { background-color: #f1f1f1; }

        .alimento-seleccionado {
            background: #e8f4fd;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            display: none;
            border-left: 4px solid var(--color-blue);
        }

        button { background-color: var(--color-green); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-reset { background-color: #7f8c8d; margin-top: 5px; padding: 8px; font-size: 12px; }

        .comidas-hoy-box {
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 25px;
        }
        .comidas-hoy-lista { list-style: none; padding: 0; margin: 0; }
        .comida-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }
        .comida-item:last-child { border-bottom: none; }
        .comida-detalles { color: #64748b; font-size: 12px; }

        .historial-box {
            background: #fcfcfc;
            border: 1px solid #eaeaea;
            padding: 15px;
            border-radius: 18px;
        }
        .historial-lista {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
        }
        .historial-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            cursor: pointer;
        }
        .historial-item:hover { background-color: #f5f5f5; border-radius: 8px; }
        .historial-item:last-child { border-bottom: none; }
        
        .historial-info { display: flex; flex-direction: column; gap: 2px; }
        .historial-fecha { font-weight: bold; color: var(--text-main); }
        .historial-acciones { display: flex; align-items: center; gap: 12px; }
        .historial-valores { font-weight: bold; }
        
        .btn-del-item {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            width: auto;
            margin: 0;
            display: inline;
        }

        .backup-zone { display: flex; gap: 10px; margin-top: 15px; }
        .backup-zone button { font-size: 11px; padding: 8px; margin: 0; }
        .btn-export { background-color: var(--color-blue); }
        .btn-import { background-color: #9b59b6; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h2>Mi Control PKU</h2>
    </header>

    <div class="citas-container">
        <div class="citas-header">
            <h3>📅 Próximas Citas Médicas</h3>
            <button class="btn-add-cita" onclick="toggleFormCita()">+ Añadir Cita</button>
        </div>

        <div id="formCitaBox" class="form-cita-box">
            <input type="text" id="citaNota" placeholder="Ej: Control INTA, Examen...">
            <input type="datetime-local" id="citaFechaHora">
            <div>
                <button onclick="guardarNuevaCita()">Guardar</button>
                <button style="background-color:#7f8c8d;" onclick="toggleFormCita()">Cancelar</button>
            </div>
        </div>

        <ul id="listaCitas" class="citas-lista">
            </ul>
    </div>

    <div class="medidor-box">
        <div class="circulo-progreso" id="medidorVisual">
            <div class="circulo-interno">
                <span class="valores-fa" id="txtConsumido">0 mg</span>
                <div class="meta-container">
                    <span id="txtMeta">Meta: 300 mg</span>
                    <button class="btn-edit-meta" onclick="cambiarMeta()" title="Cambiar meta diaria">⚙️</button>
                </div>
            </div>
        </div>
    </div>

    <div class="btn-undo-container">
        <button id="btnUndo" class="btn-undo" onclick="volverAtras()" disabled>↩️ Volver Atrás</button>
    </div>

    <div class="calculadora-box">
        <h3>🧮 Buscador PKU 2021</h3>
        
        <input type="text" id="buscador" placeholder="🔎 Escribe para buscar alimento..." oninput="buscarAlimento()">
        <ul id="listaSugerencias" class="sugerencias-lista"></ul>

        <div id="alimentoSeleccionadoBox" class="alimento-seleccionado"></div>

        <input type="number" id="gramos" placeholder="Gramos reales en la pesa" min="0" disabled>

        <button id="btnCalcular" onclick="calcularFA()" disabled>Calcular y Sumar</button>
        <button class="btn-reset" onclick="reiniciarDiaManual()">Reiniciar Día Actual</button>
    </div>

    <div class="comidas-hoy-box">
        <h3>📋 Comidas de Hoy</h3>
        <ul id="listaComidasHoy" class="comidas-hoy-lista">
            </ul>
    </div>

    <div class="historial-box">
        <h3>📋 Historial de Días Anteriores</h3>
        <ul id="listaHistorial" class="historial-lista">
            </ul>
        
        <div class="backup-zone">
            <button class="btn-export" onclick="exportarRespaldo()">📥 Exportar Respaldo</button>
            <button class="btn-import" onclick="importarRespaldo()">📤 Importar Respaldo</button>
            <input type="file" id="fileInput" style="display:none;" onchange="procesarArchivoRespaldo(event)">
        </div>
    </div>
</div>

<script>
    // LISTA DE ALIMENTOS BASE
    const baseDatosPKU = [
        { nombre: "Apio crudo", gramosPorcion: 25, faPorcion: 5 },
        { nombre: "Lechuga", gramosPorcion: 50, faPorcion: 11 },
        { nombre: "Pepino ensalada", gramosPorcion: 100, faPorcion: 14 },
        { nombre: "Zapallo italiano cocido", gramosPorcion: 70, faPorcion: 24 },
        { nombre: "Zanahoria cruda", gramosPorcion: 50, faPorcion: 21 },
        { nombre: "Tomate", gramosPorcion: 80, faPorcion: 22 },
        { nombre: "Manzana", gramosPorcion: 100, faPorcion: 11 },
        { nombre: "Plátano (Banana)", gramosPorcion: 60, faPorcion: 34 },
        { nombre: "Naranja", gramosPorcion: 120, faPorcion: 29 },
        { nombre: "Papa cocida", gramosPorcion: 70, faPorcion: 53 }
    ];

    let metaDiaria = parseFloat(localStorage.getItem('pku_meta')) || 300;
    let consumidoHoy = parseFloat(localStorage.getItem('pku_consumido')) || 0;
    let alimentoActual = null;
    
    let comidasHoy = JSON.parse(localStorage.getItem('pku_comidas_hoy')) || [];
    let historialDias = JSON.parse(localStorage.getItem('pku_historial')) || [];
    
    // Cargar arreglo de citas médicas desde memoria local
    let citasMedicas = JSON.parse(localStorage.getItem('pku_citas')) || [];

    let pilaEstadosAnteriores = [];

    window.onload = function() {
        verificarCambioDeDiaAutomatico();
        actualizarPantalla();
        renderizarComidasHoy();
        renderizarHistorial();
        renderizarCitas();
        actualizarBotonUndoVisual();
    };

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker OK'))
            .catch(err => console.warn('Error SW', err));
    }

    // --- FUNCIONES DEL CALENDARIO DE CITAS ---
    function toggleFormCita() {
        const box = document.getElementById('formCitaBox');
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
        // Limpiar campos al abrir/cerrar
        document.getElementById('citaNota').value = '';
        document.getElementById('citaFechaHora').value = '';
    }

    function guardarNuevaCita() {
        const nota = document.getElementById('citaNota').value.trim();
        const fechaHoraValue = document.getElementById('citaFechaHora').value;

        if (!nota || !fechaHoraValue) {
            alert("Por favor, introduce una descripción y la fecha/hora de la cita.");
            return;
        }

        // Formatear la fecha de visualización amigable (DD/MM/AAAA - HH:MM)
        const f = new Date(fechaHoraValue);
        const dia = String(f.getDate()).padStart(2, '0');
        const mes = String(f.getMonth() + 1).padStart(2, '0');
        const anio = f.getFullYear();
        const horas = String(f.getHours()).padStart(2, '0');
        const minutos = String(f.getMinutes()).padStart(2, '0');
        const fechaFormateada = `${dia}/${mes}/${anio} a las ${horas}:${minutos} hrs`;

        const nuevaCita = {
            id: Date.now(),
            texto: nota,
            fechaTexto: fechaFormateada,
            rawDateTime: fechaHoraValue
        };

        // Guardar y ordenar citas cronológicamente por fecha aproximada
        citasMedicas.push(nuevaCita);
        citasMedicas.sort((a, b) => new Date(a.rawDateTime) - new Date(b.rawDateTime));
        
        localStorage.setItem('pku_citas', JSON.stringify(citasMedicas));
        
        toggleFormCita();
        renderizarCitas();
    }

    function renderizarCitas() {
        const listaUI = document.getElementById('listaCitas');
        listaUI.innerHTML = "";

        if (citasMedicas.length === 0) {
            listaUI.innerHTML = "<li style='padding:5px; font-size:12px; color:#555; text-align:center; list-style:none;'>No tienes citas médicas programadas.</li>";
            return;
        }

        citasMedicas.forEach(cita => {
            const li = document.createElement('li');
            li.className = "cita-item";
            li.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:2px;">
                    <strong>📌 ${cita.texto}</strong>
                    <span class="cita-fecha-info">⏰ ${cita.fechaTexto}</span>
                </div>
                <button class="btn-del-item" onclick="borrarCitaIndividual(${cita.id})" title="Borrar cita">❌</button>
            `;
            listaUI.appendChild(li);
        });
    }

    function borrarCitaIndividual(idCita) {
        if (confirm("¿Quieres eliminar esta cita médica de la lista?")) {
            citasMedicas = citasMedicas.filter(c => c.id !== idCita);
            localStorage.setItem('pku_citas', JSON.stringify(citasMedicas));
            renderizarCitas();
        }
    }


    // --- RESTO DE FUNCIONES (MÁQUINA DEL TIEMPO, CALCULADORA E HISTORIAL) ---
    function guardarEstadoParaUndo() {
        pilaEstadosAnteriores.push({
            consumido: consumidoHoy,
            comidas: JSON.parse(JSON.stringify(comidasHoy))
        });
        if (pilaEstadosAnteriores.length > 10) pilaEstadosAnteriores.shift();
        actualizarBotonUndoVisual();
    }

    function volverAtras() {
        if (pilaEstadosAnteriores.length === 0) return;
        const estadoAnterior = pilaEstadosAnteriores.pop();
        consumidoHoy = estadoAnterior.consumido;
        comidasHoy = estadoAnterior.comidas;

        localStorage.setItem('pku_consumido', consumidoHoy);
        localStorage.setItem('pku_comidas_hoy', JSON.stringify(comidasHoy));

        actualizarPantalla();
        renderizarComidasHoy();
        actualizarBotonUndoVisual();
    }

    function actualizarBotonUndoVisual() {
        const btn = document.getElementById('btnUndo');
        if (pilaEstadosAnteriores.length > 0) {
            btn.disabled = false;
            btn.style.backgroundColor = "#cbd5e1";
        } else {
            btn.disabled = true;
            btn.style.backgroundColor = "#e2e8f0";
        }
    }

    function verificarCambioDeDiaAutomatico() {
        const fechaActual = new Date();
        const fechaStringHoy = fechaActual.getDate() + "/" + (fechaActual.getMonth() + 1) + "/" + fechaActual.getFullYear();
        const ultimaFechaRegistrada = localStorage.getItem('pku_ultima_fecha');

        if (!ultimaFechaRegistrada) {
            localStorage.setItem('pku_ultima_fecha', fechaStringHoy);
            return;
        }

        if (ultimaFechaRegistrada !== fechaStringHoy) {
            if (consumidoHoy > 0 || comidasHoy.length > 0) {
                const registroDiaPasado = {
                    id: Date.now(),
                    fecha: ultimaFechaRegistrada,
                    consumido: consumidoHoy.toFixed(0),
                    meta: metaDiaria.toFixed(0)
                };
                historialDias.unshift(registroDiaPasado);
                localStorage.setItem('pku_historial', JSON.stringify(historialDias));
            }

            consumidoHoy = 0;
            comidasHoy = [];
            pilaEstadosAnteriores = [];
            localStorage.setItem('pku_consumido', 0);
            localStorage.setItem('pku_comidas_hoy', JSON.stringify(comidasHoy));
            localStorage.setItem('pku_ultima_fecha', fechaStringHoy);
        }
    }

    function cambiarMeta() {
        const nuevaMeta = prompt("Ingresa el límite diario de FA asignado por tu nutricionista (en mg):", metaDiaria);
        if (nuevaMeta !== null) {
            const valorNumerico = parseFloat(nuevaMeta);
            if (!isNaN(valorNumerico) && valorNumerico > 0) {
                metaDiaria = valorNumerico;
                localStorage.setItem('pku_meta', metaDiaria);
                actualizarPantalla();
            } else {
                alert("Por favor, ingresa un número válido y mayor a 0.");
            }
        }
    }

    function buscarAlimento() {
        const query = document.getElementById('buscador').value.toLowerCase();
        const lista = document.getElementById('listaSugerencias');
        lista.innerHTML = "";

        if (query.trim() === "") {
            lista.style.display = "none";
            return;
        }

        const filtrados = baseDatosPKU.filter(a => a.nombre.toLowerCase().includes(query));

        if (filtrados.length > 0) {
            lista.style.display = "block";
            filtrados.forEach(alimento => {
                const li = document.createElement('li');
                li.innerText = `${alimento.nombre} (Porción: ${alimento.gramosPorcion}g = ${alimento.faPorcion}mg FA)`;
                li.onclick = () => seleccionarAlimento(alimento);
                lista.appendChild(li);
            });
        } else {
            lista.style.display = "none";
        }
    }

    function seleccionarAlimento(alimento) {
        alimentoActual = alimento;
        document.getElementById('alimentoSeleccionadoBox').innerText = `Seleccionado: ${alimento.nombre} (Base: ${alimento.gramosPorcion}g)`;
        document.getElementById('alimentoSeleccionadoBox').style.display = "block";
        document.getElementById('listaSugerencias').style.display = "none";
        document.getElementById('buscador').value = "";
        
        document.getElementById('gramos').disabled = false;
        document.getElementById('btnCalcular').disabled = false;
        document.getElementById('gramos').focus();
    }

    function calcularFA() {
        const fechaActual = new Date();
        const fechaStringHoy = fechaActual.getDate() + "/" + (fechaActual.getMonth() + 1) + "/" + fechaActual.getFullYear();
        localStorage.setItem('pku_ultima_fecha', fechaStringHoy);

        const gramosUsuario = parseFloat(document.getElementById('gramos').value);
        if (!gramosUsuario || gramosUsuario <= 0) {
            alert("Por favor, ingresa los gramos medidos.");
            return;
        }

        guardarEstadoParaUndo();

        const resultadoFA = (gramosUsuario * alimentoActual.faPorcion) / alimentoActual.gramosPorcion;
        const faRedondeada = Math.round(resultadoFA);
        
        consumidoHoy += faRedondeada;
        localStorage.setItem('pku_consumido', consumidoHoy);

        const nuevaComida = {
            id: Date.now(),
            nombre: alimentoActual.nombre,
            gramos: gramosUsuario,
            fa: faRedondeada
        };
        comidasHoy.push(nuevaComida);
        localStorage.setItem('pku_comidas_hoy', JSON.stringify(comidasHoy));

        document.getElementById('gramos').value = '';
        document.getElementById('gramos').disabled = true;
        document.getElementById('btnCalcular').disabled = true;
        document.getElementById('alimentoSeleccionadoBox').style.display = "none";
        alimentoActual = null;

        actualizarPantalla();
        renderizarComidasHoy();
    }

    function renderizarComidasHoy() {
        const listaUI = document.getElementById('listaComidasHoy');
        listaUI.innerHTML = "";

        if (comidasHoy.length === 0) {
            listaUI.innerHTML = "<li style='padding:5px; font-size:13px; color:#95a5a6; text-align:center;'>No has registrado alimentos hoy.</li>";
            return;
        }

        comidasHoy.forEach(item => {
            const li = document.createElement('li');
            li.className = "comida-item";
            li.innerHTML = `
                <div>
                    <strong>${item.nombre}</strong> 
                    <span class="comida-detalles">(${item.gramos}g)</span>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-weight: bold; color: var(--text-main);">${item.fa} mg</span>
                    <button class="btn-del-item" onclick="borrarComidaIndividual(${item.id}, ${item.fa})" title="Eliminar este alimento">❌</button>
                </div>
            `;
            listaUI.appendChild(li);
        });
    }

    function borrarComidaIndividual(idComida, faARestar) {
        if (confirm("¿Quieres eliminar este alimento del registro de hoy? Se descontará de tu medidor.")) {
            guardarEstadoParaUndo();

            comidasHoy = comidasHoy.filter(c => c.id !== idComida);
            localStorage.setItem('pku_comidas_hoy', JSON.stringify(comidasHoy));
            
            consumidoHoy -= faARestar;
            if (consumidoHoy < 0) consumidoHoy = 0;
            localStorage.setItem('pku_consumido', consumidoHoy);
            
            actualizarPantalla();
            renderizarComidasHoy();
        }
    }

    function actualizarPantalla() {
        document.getElementById('txtConsumido').innerText = consumidoHoy.toFixed(0) + " mg";
        document.getElementById('txtMeta').innerText = `Meta: ${metaDiaria.toFixed(0)} mg`;
        
        let porcentaje = (consumidoHoy / metaDiaria) * 100;
        if (porcentaje > 100) porcentaje = 100;

        let colorSemaforo = "var(--color-green)";
        if (consumidoHoy >= metaDiaria * 0.8 && consumidoHoy < metaDiaria) {
            colorSemaforo = "var(--color-yellow)";
        } else if (consumidoHoy >= metaDiaria) {
            colorSemaforo = "var(--color-red)";
        }

        const medidor = document.getElementById('medidorVisual');
        medidor.style.background = `conic-gradient(${colorSemaforo} ${porcentaje}%, #e0e0e0 ${porcentaje}%)`;
    }

    function reiniciarDiaManual() {
        if(confirm("¿Quieres REINICIAR el medidor y las comidas de hoy a cero? (Esto NO guardará datos en el historial anterior).")) {
            guardarEstadoParaUndo();
            consumidoHoy = 0;
            comidasHoy = [];
            localStorage.setItem('pku_consumido', 0);
            localStorage.setItem('pku_comidas_hoy', JSON.stringify(comidasHoy));
            
            actualizarPantalla();
            renderizarComidasHoy();
        }
    }

    function renderizarHistorial() {
        const listaUI = document.getElementById('listaHistorial');
        listaUI.innerHTML = "";

        if (historialDias.length === 0) {
            listaUI.innerHTML = "<li style='padding:10px; font-size:12px; color:#95a5a6; text-align:center;'>No hay días archivados todavía.</li>";
            return;
        }

        historialDias.forEach(dia => {
            const li = document.createElement('li');
            li.className = "historial-item";
            
            li.onclick = (e) => {
                if (e.target.tagName !== 'BUTTON') {
                    revisarDiaEspecifico(dia);
                }
            };

            li.innerHTML = `
                <div class="historial-info">
                    <span class="historial-fecha">Día ${dia.fecha.split('/')[0] + '/' + dia.fecha.split('/')[1]}</span>
                </div>
                <div class="historial-acciones">
                    <span class="historial-valores" style="color: ${parseFloat(dia.consumido) >= parseFloat(dia.meta) ? 'var(--color-red)' : 'var(--color-green)'}">
                        ${dia.consumido} / ${dia.meta} mg
                    </span>
                    <button class="btn-del-item" onclick="borrarDiaIndividual(${dia.id}, '${dia.fecha}')" title="Borrar este día">❌</button>
                </div>
            `;
            listaUI.appendChild(li);
        });
    }

    function revisarDiaEspecifico(dia) {
        const porcentaje = Math.round((parseFloat(dia.consumido) / parseFloat(dia.meta)) * 100);
        let estadoMensaje = "Bajo el límite seguro ✅";
        if (porcentaje >= 100) {
            estadoMensaje = "Límite diario excedido ⚠️";
        } else if (porcentaje >= 80) {
            estadoMensaje = "Cerca del límite diario asignado 🟡";
        }

        alert(
            `📋 INFORME PKU - FECHA: ${dia.fecha}\n\n` +
            `• Consumo Total: ${dia.consumido} mg de FA\n` +
            `• Meta de ese día: ${dia.meta} mg de FA\n` +
            `• Porcentaje alcanzado: ${porcentaje}%\n` +
            `• Estado: ${estadoMensaje}`
        );
    }

    function borrarDiaIndividual(idParaBorrar, fechaParaMostrar) {
        if (confirm(`¿Estás seguro de que quieres eliminar del registro el día ${fechaParaMostrar.split('/')[0] + '/' + fechaParaMostrar.split('/')[1]}?`)) {
            historialDias = historialDias.filter(dia => dia.id !== idParaBorrar);
            localStorage.setItem('pku_historial', JSON.stringify(historialDias));
            renderizarHistorial();
        }
    }

    function exportarRespaldo() {
        const datosParaRespaldar = {
            meta: metaDiaria,
            historial: historialDias,
            comidas_hoy: comidasHoy,
            citas: citasMedicas // Respaldar también las citas médicas
        };
        
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datosParaRespaldar));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "respaldo_pku.txt");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importaráRespaldo() { document.getElementById('fileInput').click(); }
    function importarRespaldo() { importaráRespaldo(); }

    function procesarArchivoRespaldo(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const datosRestaurados = JSON.parse(e.target.result);
                
                if (datosRestaurados.meta && Array.isArray(datosRestaurados.historial)) {
                    metaDiaria = parseFloat(datosRestaurados.meta);
                    historialDias = datosRestaurados.historial;
                    comidasHoy = datosRestaurados.comidas_hoy || [];
                    citasMedicas = datosRestaurados.citas || []; // Restaurar citas médicas
                    pilaEstadosAnteriores = [];
                    
                    consumidoHoy = comidasHoy.reduce((acc, c) => acc + c.fa, 0);
                    
                    localStorage.setItem('pku_meta', metaDiaria);
                    localStorage.setItem('pku_historial', JSON.stringify(historialDias));
                    localStorage.setItem('pku_comidas_hoy', JSON.stringify(comidasHoy));
                    localStorage.setItem('pku_citas', JSON.stringify(citasMedicas));
                    localStorage.setItem('pku_consumido', consumidoHoy);
                    
                    actualizarPantalla();
                    renderizarComidasHoy();
                    renderizarHistorial();
                    renderizarCitas();
                    actualizarBotonUndoVisual();
                    alert("¡Copia de seguridad restaurada con éxito! ✅");
                } else {
                    alert("El archivo seleccionado no tiene un formato válido de respaldo PKU.");
                }
            } catch (err) {
                alert("Error al leer el archivo. Asegúrate de seleccionar el archivo respaldo_pku.txt correcto.");
            }
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
