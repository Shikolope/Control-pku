<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKU Control Oficial</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --color-green: #2ecc71;
            --color-yellow: #f1c40f;
            --color-red: #e74c3c;
            --color-blue: #3498db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 412px;
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 20px;
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 20px; }
        h2, h3 { margin: 0 0 10px 0; }

        /* Estilos de la Zona de Citas Médicas */
        .citas-container {
            background-color: rgba(52, 152, 219, 0.08);
            border-left: 5px solid var(--color-blue);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .citas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .citas-header h3 { font-size: 15px; margin: 0; color: #2980b9; }
        .btn-add-cita {
            background-color: var(--color-blue);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 4px 12px;
            font-size: 11px;
            cursor: pointer;
            width: auto;
            margin: 0;
        }
        .form-cita-box {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            display: none;
        }
        .form-cita-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .form-cita-box div { display: flex; gap: 8px; }
        .form-cita-box button { padding: 8px; font-size: 12px; margin: 0; }
        .citas-lista { list-style: none; padding: 0; margin: 0; }
        .cita-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
        }
        .cita-item:last-child { margin-bottom: 0; }
        .cita-fecha-info { font-weight: bold; color: #475569; font-size: 11px; }

        .medidor-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .circulo-progreso {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(var(--color-green) 0%, #e0e0e0 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        .circulo-interno {
            width: 130px;
            height: 130px;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .valores-fa { font-size: 24px; font-weight: bold; }
        
        .meta-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .btn-edit-meta {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            margin: 0;
            width: auto;
            display: inline;
        }

        .btn-undo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -10px;
            margin-bottom: 20px;
        }
        .btn-undo {
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            width: auto;
            margin: 0;
        }
        .btn-undo:disabled { opacity: 0.4; cursor: not-allowed; }

        .calculadora-box { background: #f8f9fa; padding: 15px; border-radius: 18px; margin-bottom: 20px; }
        input[type="text"], input[type="number"], button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* Estilos de las Sugerencias con Colores del Buscador */
        .sugerencias-lista {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            max-height: 180px;
            overflow-y: auto;
            margin-top: -10px;
            margin-bottom: 10px;
            padding: 0;
            list-style: none;
            display: none;
        }
        .sugerencias-lista li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .sugerencias-lista li:hover { background-color: #f1f1f1; }
        
        /* Etiquetas de advertencia visual */
        .tag-alimento {
            font-size: 10px;
            font-weight: bold;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            text-transform: uppercase;
        }
        .tag-permitido { background-color: var(--color-green); }
        .tag-controlado { background-color: var(--color-yellow); color: #744210; }
        .tag-prohibido { background-color: var(--color-red); }

        .alimento-seleccionado {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        button { background-color: var(--color-green); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-reset { background-color: #7f8c8d; margin-top: 5px; padding: 8px; font-size: 12px; }

        .comidas-hoy-box {

            border: 1px solid #e2e8f0;

            border-radius: 18px;
            margin-bottom: 25px;

            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }
        .comida-item:last-child { border-bottom: none; }
        .comida-detalles { color: #64748b; font-size: 12px; }

        .historial-box {
            background: #fcfcfc;
            border: 1px solid #eaeaea;
            padding: 15px;
            border-radius: 18px;
        }
        .historial-lista {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;

        }
        .historial-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;

        }
        .historial-item:hover { background-color: #f5f5f5; border-radius: 8px; }
        .historial-item:last-child { border-bottom: none; }
        
        .historial-info { display: flex; flex-direction: column; gap: 2px; }
        .historial-fecha { font-weight: bold; color: var(--text-main); }
        .historial-acciones { display: flex; align-items: center; gap: 12px; }
        .historial-valores { font-weight: bold; }

            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            width: auto;
            margin: 0;
            display: inline;
        }

        .backup-zone { display: flex; gap: 10px; margin-top: 15px; }
        .backup-zone button { font-size: 11px; padding: 8px; margin: 0; }
        .btn-export { background-color: var(--color-blue); }
        .btn-import { background-color: #9b59b6; }
    </style>
</head>
<body>

        <h2>Mi Control PKU</h2>

    // --- CITAS MÉDICAS ---
    function toggleFormCita() {
        const box = document.getElementById('formCitaBox');
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
        document.getElementById('citaNota').value = '';
        document.getElementById('citaFechaHora').value = '';
    }

    function guardarNuevaCita() {
        const nota = document.getElementById('citaNota').value.trim();
        const fechaHoraValue = document.getElementById('citaFechaHora').value;

        if (!nota || !fechaHoraValue) {
            alert("Por favor, introduce una descripción y la fecha/hora de la cita.");
            return;
        }

        const f = new Date(fechaHoraValue);
        const nombreDia = diasSemana[f.getDay()];
        const dia = String(f.getDate()).padStart(2, '0');
        const mes = String(f.getMonth() + 1).padStart(2, '0');
        const horas = String(f.getHours()).padStart(2, '0');
        const minutos = String(f.getMinutes()).padStart(2, '0');
        
        const fechaFormateada = `${nombreDia}, ${dia}/${mes} a las ${horas}:${minutos} hrs`;

        const nuevaCita = {
            id: Date.now(),
            texto: nota,
            fechaTexto: fechaFormateada,
            rawDateTime: fechaHoraValue
        };

        citasMedicas.push(nuevaCita);
        citasMedicas.sort((a, b) => new Date(a.rawDateTime) - new Date(b.rawDateTime));
        localStorage.setItem('pku_citas', JSON.stringify(citasMedicas));
        
        toggleFormCita();
        renderizarCitas();
    }

    function renderizarCitas() {
        const listaUI = document.getElementById('listaCitas');
        listaUI.innerHTML = "";

        if (citasMedicas.length === 0) {
            listaUI.innerHTML = "<li style='padding:5px; font-size:12px; color:#555; text-align:center; list-style:none;'>No tienes citas médicas programadas.</li>";
            return;
        }

        citasMedicas.forEach(cita => {
            const li = document.createElement('li');
            li.className = "cita-item";
            li.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:2px;">
                    <strong>📌 ${cita.texto}</strong>
                    <span class="cita-fecha-info">⏰ ${cita.fechaTexto}</span>
                </div>
                <button class="btn-del-item" onclick="borrarCitaIndividual(${cita.id})" title="Borrar cita">❌</button>
            `;
            listaUI.appendChild(li);
        });
    }

    function borrarCitaIndividual(idCita) {
        if (confirm("¿Quieres eliminar esta cita médica de la lista?")) {
            citasMedicas = citasMedicas.filter(c => c.id !== idCita);
            localStorage.setItem('pku_citas', JSON.stringify(citasMedicas));
            renderizarCitas();
        }
    }

        lista.innerHTML = "";

        if (query.trim() === "") {
            lista.style.display = "none";
            return;
        }

        const filtrados = baseDatosPKU.filter(a => a.nombre.toLowerCase().includes(query));

        if (filtrados.length > 0) {
            lista.style.display = "block";
            filtrados.forEach(alimento => {
                const li = document.createElement('li');
                
                // Definir texto y color de la etiqueta miniatura en la lista
                let textoTag = "Permitido";
                let claseTag = "tag-permitido";
                if(alimento.tipo === "controlado") { textoTag = "Al Límite"; claseTag = "tag-controlado"; }
                if(alimento.tipo === "prohibido") { textoTag = "Prohibido"; claseTag = "tag-prohibido"; }

                li.innerHTML = `
                    <span>${alimento.nombre}</span>
                    <span class="tag-alimento ${claseTag}">${textoTag}</span>
                `;
                li.onclick = () => seleccionarAlimento(alimento);
                lista.appendChild(li);
            });
        } else {
            lista.style.display = "none";
        }
    }

    function seleccionarAlimento(alimento) {
        alimentoActual = alimento;
        const box = document.getElementById('alimentoSeleccionadoBox');
        const inputGramos = document.getElementById('gramos');
        const btnCalc = document.getElementById('btnCalcular');
        
        box.style.display = "block";
        document.getElementById('listaSugerencias').style.display = "none";
        document.getElementById('buscador').value = "";

        // CASO 1: PERMITIDO 🟢
        if (alimento.tipo === "permitido") {
            box.innerText = `🟢 OK: ${alimento.nombre} (Base: ${alimento.gramosPorcion}g = ${alimento.faPorcion}mg FA)`;
            box.style.backgroundColor = "rgba(46, 204, 113, 0.15)";
            box.style.color = "#1e7e34";
            box.style.borderLeft = "4px solid var(--color-green)";
            inputGramos.disabled = false;
            btnCalc.disabled = false;
            inputGramos.focus();
        } 
        // CASO 2: CONTROLADO (AL LÍMITE) 🟡
        else if (alimento.tipo === "controlado") {
            box.innerText = `🟡 AL LÍMITE: ${alimento.nombre} (Base: ${alimento.gramosPorcion}g = ${alimento.faPorcion}mg FA). ¡Pesar estrictamente!`;
            box.style.backgroundColor = "rgba(241, 196, 15, 0.15)";
            box.style.color = "#744210";
            box.style.borderLeft = "4px solid var(--color-yellow)";
            inputGramos.disabled = false;
            btnCalc.disabled = false;
            inputGramos.focus();
        } 
        // CASO 3: PROHIBIDO 🔴
        else if (alimento.tipo === "prohibido") {
            box.innerText = `🔴 PROHIBIDO: ${alimento.nombre} contiene niveles peligrosos de proteína/FA. No apto para la dieta PKU.`;
            box.style.backgroundColor = "rgba(231, 76, 60, 0.15)";
            box.style.color = "#b71c1c";
            box.style.borderLeft = "4px solid var(--color-red)";
            
            // Bloquear por completo el ingreso numérico y el cálculo
            inputGramos.value = "";
            inputGramos.disabled = true;
            btnCalc.disabled = true;
        }
    }

    function calcularFA() {
        const gramosUsuario = parseFloat(document.getElementById('gramos').value);
        if (!gramosUsuario || gramosUsuario <= 0) {
            alert("Por favor, ingresa los gramos medidos.");
            return;
        }

        guardarEstadoParaUndo();

        const resultadoFA = (gramosUsuario * alimentoActual.faPorcion) / alimentoActual.gramosPorcion;
        const faRedondeada = Math.round(resultadoFA);
        
        consumidoHoy += faRedondeada;
        localStorage.setItem('pku_consumido', consumidoHoy);

        comidasHoy.push({
            id: Date.now(),
            nombre: alimentoActual.nombre,
            gramos: gramosUsuario,
            fa: faRedondeada
        });
        localStorage.setItem('pku_comidas_hoy', JSON.stringify(comidasHoy));

        document.getElementById('gramos').value = '';
        document.getElementById('gramos').disabled = true;
        document.getElementById('btnCalcular').disabled = true;
        document.getElementById('alimentoSeleccionadoBox').style.display = "none";
        alimentoActual = null;

        actualizarPantalla();
        renderizarComidasHoy();
    }

    // --- MÁQUINA DEL TIEMPO (UNDO) ---
    function guardarEstadoParaUndo() {
        pilaEstadosAnteriores.push({
            consumido: consumidoHoy,
            comidas: JSON.parse(JSON.stringify(comidasHoy))
        });
        if (pilaEstadosAnteriores.length > 10) pilaEstadosAnteriores.shift();
        actualizarBotonUndoVisual();
    }

    function volverAtras() {
        if (pilaEstadosAnteriores.length === 0) return;
        const estadoAnterior = pilaEstadosAnteriores.pop();
        consumidoHoy = estadoAnterior.consumido;
        comidasHoy = estadoAnterior.comidas;

        localStorage.setItem('pku_consumido', consumidoHoy);
        localStorage.setItem('pku_comidas_hoy', JSON.stringify(comidasHoy));

        actualizarPantalla();
        renderizarComidasHoy();
        actualizarBotonUndoVisual();
    }

    function actualizarBotonUndoVisual() {
        const btn = document.getElementById('btnUndo');
        btn.disabled = pilaEstadosAnteriores.length === 0;
        btn.style.backgroundColor = pilaEstadosAnteriores.length > 0 ? "#cbd5e1" : "#e2e8f0";
    }

    // --- CRONÓMETRO AUTOMÁTICO 00:00 ---
    function verificarCambioDeDiaAutomatico() {
        const fechaActual = new Date();
        const nombreDiaHoy = diasSemana[fechaActual.getDay()];
        const fechaStringHoy = fechaActual.getDate() + "/" + (fechaActual.getMonth() + 1) + "/" + fechaActual.getFullYear();
        const registroCompletoFecha = `${nombreDiaHoy} ${fechaActual.getDate()}/${fechaActual.getMonth() + 1}`;
        
        const ultimaFechaRegistrada = localStorage.getItem('pku_ultima_fecha');
        const ultimaFechaVisual = localStorage.getItem('pku_ultima_fecha_visual') || registroCompletoFecha;

        if (!ultimaFechaRegistrada) {
            localStorage.setItem('pku_ultima_fecha', fechaStringHoy);
            localStorage.setItem('pku_ultima_fecha_visual', registroCompletoFecha);
            return;
        }

        if (ultimaFechaRegistrada !== fechaStringHoy) {
            if (consumidoHoy > 0 || comidasHoy.length > 0) {
                historialDias.unshift({
                    id: Date.now(),
                    fecha: ultimaFechaVisual,
                    consumido: consumidoHoy.toFixed(0),
                    meta: metaDiaria.toFixed(0)
                });
                localStorage.setItem('pku_historial', JSON.stringify(historialDias));
            }

            consumidoHoy = 0;
            comidasHoy = [];
            pilaEstadosAnteriores = [];
            localStorage.setItem('pku_consumido', 0);
            localStorage.setItem('pku_comidas_hoy', JSON.stringify(comidasHoy));
            localStorage.setItem('pku_ultima_fecha', fechaStringHoy);
            localStorage.setItem('pku_ultima_fecha_visual', registroCompletoFecha);
        }
    }

    function cambiarMeta() {
        const nuevaMeta = prompt("Ingresa el límite diario de FA asignado por tu nutricionista (en mg):", metaDiaria);
        if (nuevaMeta !== null) {
            const valorNumerico = parseFloat(nuevaMeta);
            if (!isNaN(valorNumerico) && valorNumerico > 0) {
                metaDiaria = valorNumerico;
                localStorage.setItem('pku_meta', metaDiaria);
                actualizarPantalla();
            } else {
                alert("Por favor, ingresa un número válido y mayor a 0.");
            }
        }
    }

    function renderizarComidasHoy() {
        const listaUI = document.getElementById('listaComidasHoy');
        listaUI.innerHTML = "";
        if (comidasHoy.length === 0) {
            listaUI.innerHTML = "<li style='padding:5px; font-size:13px; color:#95a5a6; text-align:center;'>No has registrado alimentos hoy.</li>";
            return;
        }
        comidasHoy.forEach(item => {
            const li = document.createElement('li');
            li.className = "comida-item";
            li.innerHTML = `
                <div><strong>${item.nombre}</strong> <span class="comida-detalles">(${item.gramos}g)</span></div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-weight: bold;">${item.fa} mg</span>
                    <button class="btn-del-item" onclick="borrarComidaIndividual(${item.id}, ${item.fa})">❌</button>
                </div>
            `;
            listaUI.appendChild(li);
        });
    }

    function borrarComidaIndividual(idComida, faARestar) {
        if (confirm("¿Quieres eliminar este alimento del registro de hoy?")) {
            guardarEstadoParaUndo();
            comidasHoy = comidasHoy.filter(c => c.id !== idComida);
            localStorage.setItem('pku_comidas_hoy', JSON.stringify(comidasHoy));
            consumidoHoy = Math.max(0, consumidoHoy - faARestar);
            localStorage.setItem('pku_consumido', consumidoHoy);
            actualizarPantalla();
            renderizarComidasHoy();
        }
    }

    function actualizarPantalla() {
        document.getElementById('txtConsumido').innerText = consumidoHoy.toFixed(0) + " mg";
        document.getElementById('txtMeta').innerText = `Meta: ${metaDiaria.toFixed(0)} mg`;
        let porcentaje = Math.min(100, (consumidoHoy / metaDiaria) * 100);
        let colorSemaforo = "var(--color-green)";
        if (consumidoHoy >= metaDiaria * 0.8 && consumidoHoy < metaDiaria) colorSemaforo = "var(--color-yellow)";
        else if (consumidoHoy >= metaDiaria) colorSemaforo = "var(--color-red)";
        document.getElementById('medidorVisual').style.background = `conic-gradient(${colorSemaforo} ${porcentaje}%, #e0e0e0 ${porcentaje}%)`;
    }

    function reiniciarDiaManual() {
        if(confirm("¿Quieres REINICIAR el medidor y las comidas de hoy a cero?")) {
            guardarEstadoParaUndo();
            consumidoHoy = 0;
            comidasHoy = [];
            localStorage.setItem('pku_consumido', 0);
            localStorage.setItem('pku_comidas_hoy', JSON.stringify(comidasHoy));
            actualizarPantalla();
            renderizarComidasHoy();
        }
    }

    function renderizarHistorial() {
        const listaUI = document.getElementById('listaHistorial');
        listaUI.innerHTML = "";
        if (historialDias.length === 0) {
            listaUI.innerHTML = "<li style='padding:10px; font-size:12px; color:#95a5a6; text-align:center;'>No hay días archivados todavía.</li>";
            return;
        }
        historialDias.forEach(dia => {
            const li = document.createElement('li');
            li.className = "historial-item";
            li.onclick = (e) => { if (e.target.tagName !== 'BUTTON') revisarDiaEspecifico(dia); };
            li.innerHTML = `
                <div class="historial-info"><span class="historial-fecha">${dia.fecha}</span></div>
                <div class="historial-acciones">
                    <span class="historial-valores" style="color: ${parseFloat(dia.consumido) >= parseFloat(dia.meta) ? 'var(--color-red)' : 'var(--color-green)'}">${dia.consumido} / ${dia.meta} mg</span>
                    <button class="btn-del-item" onclick="borrarDiaIndividual(${dia.id}, '${dia.fecha}')">❌</button>
                </div>
            `;
            listaUI.appendChild(li);
        });
    }

    function revisarDiaEspecifico(dia) {
        const porcentaje = Math.round((parseFloat(dia.consumido) / parseFloat(dia.meta)) * 100);
        alert(`📋 INFORME PKU - FECHA: ${dia.fecha}\n\n• Consumo Total: ${dia.consumido} mg\n• Meta: ${dia.meta} mg\n• Porcentaje: ${porcentaje}%\n• Estado: ${porcentaje >= 100 ? 'Excedido ⚠️' : 'Seguro ✅'}`);
    }

    function borrarDiaIndividual(idParaBorrar, fechaParaMostrar) {
        if (confirm(`¿Eliminar el registro del día ${fechaParaMostrar}?`)) {
            historialDias = historialDias.filter(dia => dia.id !== idParaBorrar);
            localStorage.setItem('pku_historial', JSON.stringify(historialDias));
            renderizarHistorial();
        }
    }

    function exportarRespaldo() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ meta: metaDiaria, historial: historialDias, comidas_hoy: comidasHoy, citas: citasMedicas }));
        const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "respaldo_pku.txt"); dl.click();
    }

    function importarRespaldo() { document.getElementById('fileInput').click(); }

    function procesarArchivoRespaldo(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const res = JSON.parse(e.target.result);
                if (res.meta && Array.isArray(res.historial)) {
                    metaDiaria = parseFloat(res.meta); historialDias = res.historial; comidasHoy = res.comidas_hoy || []; citasMedicas = res.citas || [];
                    consumidoHoy = comidasHoy.reduce((acc, c) => acc + c.fa, 0);
                    localStorage.setItem('pku_meta', metaDiaria); localStorage.setItem('pku_historial', JSON.stringify(historialDias));
                    localStorage.setItem('pku_comidas_hoy', JSON.stringify(comidasHoy)); localStorage.setItem('pku_citas', JSON.stringify(citasMedicas));
                    localStorage.setItem('pku_consumido', consumidoHoy);
                    actualizarPantalla(); renderizarComidasHoy(); renderizarHistorial(); renderizarCitas(); actualizarBotonUndoVisual();
                    alert("¡Copia de seguridad restaurada! ✅");
                }
            } catch (err) { alert("Archivo no válido."); }
        };
        reader.readAsText(file);
    }
</script>
