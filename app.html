<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKU Control Oficial</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --color-green: #2ecc71;
            --color-yellow: #f1c40f;
            --color-red: #e74c3c;
            --color-blue: #3498db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 412px;
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 20px;
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 20px; }
        h2, h3 { margin: 0 0 10px 0; }

        .cita-card {
            background-color: rgba(52, 152, 219, 0.1);
            border-left: 5px solid var(--color-blue);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .medidor-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .circulo-progreso {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(var(--color-green) 0%, #e0e0e0 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        .circulo-interno {
            width: 130px;
            height: 130px;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .valores-fa { font-size: 24px; font-weight: bold; }
        
        .meta-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .btn-edit-meta {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            margin: 0;
            width: auto;
            display: inline;
        }

        .calculadora-box { background: #f8f9fa; padding: 15px; border-radius: 18px; margin-bottom: 25px; }
        input[type="text"], input[type="number"], button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .sugerencias-lista {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            max-height: 150px;
            overflow-y: auto;
            margin-top: -10px;
            margin-bottom: 10px;
            padding: 0;
            list-style: none;
            display: none;
        }
        .sugerencias-lista li { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .sugerencias-lista li:hover { background-color: #f1f1f1; }

        .alimento-seleccionado {
            background: #e8f4fd;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            display: none;
            border-left: 4px solid var(--color-blue);
        }

        button { background-color: var(--color-green); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-reset { background-color: #7f8c8d; margin-top: 5px; padding: 8px; font-size: 12px; }

        /* Sección de Historial y Copias de Seguridad */
        .historial-box {
            background: #fcfcfc;
            border: 1px solid #eaeaea;
            padding: 15px;
            border-radius: 18px;
        }
        .historial-lista {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 220px;
            overflow-y: auto;
        }
        .historial-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            cursor: pointer;
        }
        .historial-item:hover { background-color: #f5f5f5; border-radius: 8px; }
        .historial-item:last-child { border-bottom: none; }
        
        .historial-info { display: flex; flex-direction: column; gap: 2px; }
        .historial-fecha { font-weight: bold; color: var(--text-main); }
        
        .historial-acciones { display: flex; align-items: center; gap: 12px; }
        .historial-valores { font-weight: bold; }

            border: none;
