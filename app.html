<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKU Control - Versión 2.0</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --color-green: #2ecc71;
            --color-yellow: #f1c40f;
            --color-red: #e74c3c;
            --color-blue: #3498db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 412px;
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h2, h3 { margin: 0 0 10px 0; }

        .cita-card {
            background-color: rgba(52, 152, 219, 0.1);
            border-left: 5px solid var(--color-blue);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* El Medidor Circular Semáforo */
        .medidor-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .circulo-progreso {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(var(--color-green) 0%, #e0e0e0 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        .circulo-interno {
            width: 130px;
            height: 130px;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .valores-fa {
            font-size: 24px;
            font-weight: bold;
        }

        .meta-fa {
            font-size: 12px;
            color: #7f8c8d;
        }

        /* Checklist Silencioso de Fórmula */
        .checklist-box {
            margin-bottom: 25px;
        }

        .formula-item {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .formula-item input {
            margin-right: 15px;
            transform: scale(1.2);
        }

        .formula-item.checked {
            opacity: 0.5;
            text-decoration: line-through;
            background: #edfcf4;
        }

        /* Buscador y Calculadora Avanzada */
        .calculadora-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 18px;
        }

        input[type="text"], input[type="number"], button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* Sugerencias del buscador */
        .sugerencias-lista {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            max-height: 150px;
            overflow-y: auto;
            margin-top: -10px;
            margin-bottom: 10px;
            padding: 0;
            list-style: none;
            display: none;
        }

        .sugerencias-lista li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .sugerencias-lista li:hover {
            background-color: #f1f1f1;
        }

        .alimento-seleccionado {
            background: #e8f4fd;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            display: none;
            border-left: 4px solid var(--color-blue);
        }

        button {
            background-color: var(--color-green);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-reset {
            background-color: #7f8c8d;
            margin-top: 5px;
            padding: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h2>Mi Control PKU</h2>
    </header>

    <div class="cita-card">
        📌 <strong>Nota de recordatorio:</strong> Próximo control médico e informes del INTA el próximo jueves en la mañana.
    </div>

    <div class="medidor-box">
        <div class="circulo-progreso" id="medidorVisual">
            <div class="circulo-interno">
                <span class="valores-fa" id="txtConsumido">0 mg</span>
                <span class="meta-fa" id="txtMeta">Meta: 300 mg</span>
            </div>
        </div>
    </div>

    <div class="checklist-box">
        <h3>🍼 Registro de Fórmula (Hoy)</h3>
        <div class="formula-item" id="f-manana" onclick="toggleFormula('manana')">
            <input type="checkbox" id="chk-manana"> <span>Dosis Mañana</span>
        </div>
        <div class="formula-item" id="f-tarde" onclick="toggleFormula('tarde')">
            <input type="checkbox" id="chk-tarde"> <span>Dosis Tarde</span>
        </div>
        <div class="formula-item" id="f-noche" onclick="toggleFormula('noche')">
            <input type="checkbox" id="chk-noche"> <span>Dosis Noche</span>
        </div>
    </div>

    <div class="calculadora-box">
        <h3>🧮 Buscador e INTA Regla de 3</h3>
        
        <input type="text" id="buscador" placeholder="🔎 Busca un alimento (ej: zapallo, arroz)..." oninput="buscarAlimento()">
        <ul id="listaSugerencias" class="sugerencias-lista"></ul>

        <div id="alimentoSeleccionadoBox" class="alimento-seleccionado"></div>

        <input type="number" id="gramos" placeholder="Gramos en la pesa (Ej: 150)" min="0" disabled>

        <button id="btnCalcular" onclick="calcularFA()" disabled>Calcular y Sumar al Día</button>
        <button class="btn-reset" onclick="reiniciarDia()">Reiniciar Contador Diario</button>
    </div>
</div>

<script>
    // 1. BASE DE DATOS INTA (Ejemplo expandible con valores oficiales por cada 100g)
    const baseDatosINTA = [
        { nombre: "Zapallo italiano", fa: 26 },
        { nombre: "Plátano (Banana)", fa: 43 },
        { nombre: "Arroz corriente cocido", fa: 165 },
        { nombre: "Manzana", fa: 11 },
        { nombre: "Zanahoria cruda", fa: 33 },
        { nombre: "Papa cocida", fa: 76 },
        { nombre: "Betarraga / Remolacha", fa: 36 },
        { nombre: "Arvejas verdes cocidas", fa: 254 },
        { nombre: "Palta (Aguacate)", fa: 65 }
    ];

    // Variables de estado cargadas desde la memoria del teléfono (localStorage)
    let metaDiaria = 300;
    let consumidoHoy = parseFloat(localStorage.getItem('pku_consumido')) || 0;
    let alimentoActual = null;

    let formulasEstado = JSON.parse(localStorage.getItem('pku_formulas')) || { manana: false, tarde: false, noche: false };

    // Inicializar la interfaz al abrir
    window.onload = function() {
        actualizarPantalla();
        cargarChecklist();
    };

    // Lógica del Buscador Inteligente
    function buscarAlimento() {
        const query = document.getElementById('buscador').value.toLowerCase();
        const lista = document.getElementById('listaSugerencias');
        lista.innerHTML = "";

        if (query.trim() === "") {
            lista.style.display = "none";
            return;
        }

        const filtrados = baseDatosINTA.filter(a => a.nombre.toLowerCase().includes(query));

        if (filtrados.length > 0) {
            lista.style.display = "block";
            filtrados.forEach(alimento => {
                const li = document.createElement('li');
                li.innerText = `${alimento.nombre} (${alimento.fa}mg FA / 100g)`;
                li.onclick = () => seleccionarAlimento(alimento);
                lista.appendChild(li);
            });
        } else {
            lista.style.display = "none";
        }
    }

    function seleccionarAlimento(alimento) {
        alimentoActual = alimento;
        
        // Interfaz activa
        document.getElementById('alimentoSeleccionadoBox').innerText = `Seleccionado: ${alimento.nombre}`;
        document.getElementById('alimentoSeleccionadoBox').style.display = "block";
        document.getElementById('listaSugerencias').style.display = "none";
        document.getElementById('buscador').value = "";
        
        // Habilitar campos
        document.getElementById('gramos').disabled = false;
        document.getElementById('btnCalcular').disabled = false;
        document.getElementById('gramos').focus();
    }

    // Lógica de la Regla de Tres
    function calcularFA() {
        const gramosUsuario = parseFloat(document.getElementById('gramos').value);

        if (!gramosUsuario || gramosUsuario <= 0) {
            alert("Por favor, ingresa los gramos de tu porción.");
            return;
        }

        // REGLA DE TRES: (Gramos del plato * FA en tabla) / 100
        const resultadoFA = (gramosUsuario * alimentoActual.fa) / 100;

        consumidoHoy += resultadoFA;
        
        // Guardar en almacenamiento interno
        localStorage.setItem('pku_consumido', consumidoHoy);

        // Resetear inputs de cálculo
        document.getElementById('gramos').value = '';
        document.getElementById('gramos').disabled = true;
        document.getElementById('btnCalcular').disabled = true;
        document.getElementById('alimentoSeleccionadoBox').style.display = "none";
        alimentoActual = null;

        actualizarPantalla();
    }

    function actualizarPantalla() {
        document.getElementById('txtConsumido').innerText = consumidoHoy.toFixed(1) + " mg";
        
        let porcentaje = (consumidoHoy / metaDiaria) * 100;
        if (porcentaje > 100) porcentaje = 100;

        let colorSemaforo = "var(--color-green)";
        if (consumidoHoy >= metaDiaria * 0.8 && consumidoHoy < metaDiaria) {
            colorSemaforo = "var(--color-yellow)";
        } else if (consumidoHoy >= metaDiaria) {
            colorSemaforo = "var(--color-red)";
        }

        const medidor = document.getElementById('medidorVisual');
        medidor.style.background = `conic-gradient(${colorSemaforo} ${porcentaje}%, #e0e0e0 ${porcentaje}%)`;
    }

    // Control de Checklist Silencioso Guardado en Memoria
    function toggleFormula(momento) {
        formulasEstado[momento] = !formulasEstado[momento];
        localStorage.setItem('pku_formulas', JSON.stringify(formulasEstado));
        cargarChecklist();
    }

    function cargarChecklist() {
        for (let momento in formulasEstado) {
            const div = document.getElementById(`f-${momento}`);
            const chk = document.getElementById(`chk-${momento}`);
            if (formulasEstado[momento]) {
                div.classList.add('checked');
                chk.checked = true;
            } else {
                div.classList.remove('checked');
                chk.checked = false;
            }
        }
    }

    function reiniciarDia() {
        if(confirm("¿Quieres reiniciar el contador diario de FA y las fórmulas tomadas?")) {
            consumidoHoy = 0;
            formulasEstado = { manana: false, tarde: false, noche: false };
            
            localStorage.setItem('pku_consumido', 0);
            localStorage.setItem('pku_formulas', JSON.stringify(formulasEstado));
            
            actualizarPantalla();
            cargarChecklist();
        }
    }
</script>

</body>
</html>
